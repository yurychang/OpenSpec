name: Install channels

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Published fork npm version to verify (empty tests the packed source)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: install-channels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/*.tgz

  package-managers:
    name: Install with ${{ matrix.manager }}
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm, yarn, bun]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.manager == 'bun'
        with:
          bun-version: '1.4.3'
      - run: npm install --global yarn@1.22.22
        if: matrix.manager == 'yarn'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package
      - name: Install and initialize the fork
        env:
          MANAGER: ${{ matrix.manager }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          spec=$(find "$RUNNER_TEMP/package" -name '*.tgz' -print -quit)
          version=$(node -p "require('./package.json').version")
          if [ -n "$RELEASE_VERSION" ]; then
            spec="@yurychang/openspec@$RELEASE_VERSION"
            version="$RELEASE_VERSION"
          fi
          node scripts/verify-package-install.mjs "$MANAGER" "$spec" "$version"

  source-and-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Build and install this fork's exact Git checkout
        run: |
          pnpm install --frozen-lockfile
          node scripts/verify-package-install.mjs npm "$GITHUB_WORKSPACE"
      - name: Install the committed skill through skills.sh
        run: |
          mkdir "$RUNNER_TEMP/skills-project"
          cd "$RUNNER_TEMP/skills-project"
          npx --yes skills@1.8.1 add "https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA" --skill openspec-auto --agent codex --yes
          test -f .agents/skills/openspec-auto/SKILL.md

  homebrew:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and test this fork's HEAD formula
        run: |
          brew tap --custom-remote yurychang/openspec "https://github.com/$GITHUB_REPOSITORY.git"
          tap=$(brew --repository yurychang/openspec)
          mkdir -p "$tap/Formula"
          cp Formula/openspec.rb "$tap/Formula/openspec.rb"
          # Test this exact PR revision while main still has the old source.
          ruby -e 'p=ARGV[0]; s=File.read(p); s.sub!(%{branch: "main"}, %{revision: "#{ENV.fetch("GITHUB_SHA")}"}); File.write(p,s)' "$tap/Formula/openspec.rb"
          brew install --HEAD yurychang/openspec/openspec
          brew test yurychang/openspec/openspec
          test "$(openspec --version)" = "$(node -p "require('./package.json').version")"

  deno:
    if: inputs.version != '' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global deno
      - name: Install the published fork through Deno
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          OPENSPEC_TELEMETRY: '0'
          OPENSPEC_NO_UPDATE_CHECK: '1'
        run: |
          export DENO_INSTALL_ROOT="$RUNNER_TEMP/deno-install"
          deno install --global --allow-read --allow-write --allow-env --allow-sys=cpus,homedir --allow-net=edge.openspec.dev "npm:@yurychang/openspec@$RELEASE_VERSION"
          test "$("$DENO_INSTALL_ROOT/bin/openspec" --version)" = "$RELEASE_VERSION"
